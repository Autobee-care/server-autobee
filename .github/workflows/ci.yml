name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify go.sum
        run: go mod verify

      - name: Check formatting (gofmt)
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "The following files are not formatted:"
            echo "$output"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Unit tests
        run: go test ./... -short -count=1 -timeout=60s

      - name: Integration tests (Testcontainers)
        run: go test ./tests/integration/... -v -count=1 -timeout=180s
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Coverage report
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -count=1 -timeout=180s
          go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage.out

      - name: Build binary
        run: go build -ldflags="-w -s" -o bin/api ./cmd/api
