pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -l {staged_files}
      fail_text: "Some Go files are not formatted. Run: make format"

    goimports:
      glob: "*.go"
      run: goimports -l {staged_files}
      fail_text: "Some imports are not organized. Run: make format"

    govet:
      glob: "*.go"
      run: go vet ./...

    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --timeout 60s ./...

commit-msg:
  commands:
    conventional-commit:
      run: |
        MSG=$(cat {1})
        if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,100}$"; then
          echo "❌ Commit message must follow Conventional Commits format."
          echo "   Examples:"
          echo "     feat: add vehicle module"
          echo "     fix: prevent cross-tenant access"
          echo "     docs: update README"
          exit 1
        fi
