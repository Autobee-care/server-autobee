run:
  linters:
    enable:
      - errcheck
      - govet
      - staticcheck
      - ineffassign
      - unused
      - gosimple
      - gosec
      - revive
      - bodyclose
      - contextcheck
      - gofmt
      - goimports
      - misspell
      - unconvert
      - predeclared
    disable:
      - depguard
      - exhaustruct
      - wrapcheck
      - varnamelen
      - exhaustive

  linters-settings:
    goimports:
      local-prefixes: github.com/autobee/server
    revive:
      rules:
        - name: exported
          severity: warning
        - name: unexported-return
          severity: warning
    gosec:
      excludes:
        - G401 # Allow MD5 for non-crypto use
        - G501 # Allow MD5 for non-crypto use

  issues:
    exclude-rules:
      # Test files can use any packages without lint restriction.
      - path: "_test\\.go"
        linters:
          - gosec
          - errcheck
      # Allow panic in main (startup failures).
      - path: "cmd/api/main.go"
        linters:
          - revive

  timeout: 5m
